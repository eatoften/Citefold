name: Change-level CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Compile Python sources
        run: uv run --frozen python -m compileall -q app tests

      - name: Run backend tests
        run: uv run --frozen pytest -q --junitxml=pytest-results.xml

      - name: Publish backend failure annotations
        if: failure() && hashFiles('backend/pytest-results.xml') != ''
        run: |
          uv run --frozen python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          def escape(value: str) -> str:
              return (
                  value.replace("%", "%25")
                  .replace("\r", "%0D")
                  .replace("\n", "%0A")
              )

          root = ElementTree.parse(Path("pytest-results.xml")).getroot()
          for case in root.iter("testcase"):
              problem = case.find("failure")
              if problem is None:
                  problem = case.find("error")
              if problem is None:
                  continue
              identity = f"{case.get('classname', '')}::{case.get('name', '')}"
              detail = (problem.text or problem.get("message") or "pytest failed")[-4000:]
              print(f"::error title={escape(identity)}::{escape(detail)}")
          PY

  frontend:
    name: Frontend / Node.js 22
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  desktop:
    name: Desktop / Rust stable
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend/src-tauri
    env:
      CARGO_TERM_COLOR: always
      # This job validates Rust code, not release packaging. The release
      # workflow supplies and verifies the real PyInstaller sidecar.
      TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-08
        with:
          components: rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check desktop crate
        run: cargo check --locked

      - name: Run desktop tests
        run: cargo test --locked
